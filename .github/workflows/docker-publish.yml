name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-thunderbird-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/containerpak/thunderbird
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          pull: true
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify exports
        run: docker run --rm ghcr.io/containerpak/thunderbird:main sh -c 'test -x /usr/bin/thunderbird && test -f /usr/share/applications/thunderbird.desktop'
      - name: Publish summary
        run: echo "ghcr.io/containerpak/thunderbird@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
